<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Line drawing of an adjustable desk lamp shining with magic sparkles">
  <g stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- magic glow lines -->
    <path d="M262 138 L292 176 M286 120 L326 142 M244 150 L262 196" stroke-width="4"/>
    <!-- base -->
    <ellipse cx="130" cy="262" rx="72" ry="16" fill="#fffdf5"/>
    <!-- arm: two segments with round joints -->
    <path d="M130 248 L130 180 L206 112" stroke-width="9"/>
    <circle cx="130" cy="180" r="10" fill="#fffdf5"/>
    <circle cx="206" cy="112" r="9" fill="#fffdf5"/>
    <!-- lamp shade -->
    <path d="M190 78 L252 56 L300 126 L232 140 Z" fill="#c8102e"/>
    <path d="M214 70 L260 96 M232 134 L262 90" stroke="#fffdf5" stroke-width="3"/>
    <!-- bulb glow -->
    <circle cx="262" cy="140" r="7" fill="#fffdf5"/>
    <path d="M70 70 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#fffdf5" stroke-width="3"/>
    <path d="M330 220 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#fffdf5" stroke-width="3"/>
  </g>
</svg>
