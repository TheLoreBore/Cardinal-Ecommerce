<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Line drawing of a compact mini fridge with a freezer door">
  <g stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- fridge body -->
    <rect x="110" y="34" width="180" height="226" rx="14" fill="#fffdf5"/>
    <!-- feet -->
    <path d="M136 260 V272 M264 260 V272" stroke-width="8"/>
    <!-- freezer door divider -->
    <path d="M110 112 H290"/>
    <!-- handles -->
    <rect x="128" y="58" width="10" height="38" rx="5" fill="#1a1a1a"/>
    <rect x="128" y="136" width="10" height="72" rx="5" fill="#1a1a1a"/>
    <!-- snowflake on the freezer door -->
    <path d="M220 58 V92 M203 63 L237 87 M203 87 L237 63" stroke="#c8102e" stroke-width="4"/>
    <!-- red cardinal-star magnet -->
    <circle cx="230" cy="184" r="26" fill="#c8102e"/>
    <path d="M230 168 l4 9 10 1 -8 6 3 10 -9 -5 -9 5 3 -10 -8 -6 10 -1 z" fill="#fffdf5" stroke-width="2.5"/>
    <path d="M322 50 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#fffdf5" stroke-width="3"/>
    <path d="M52 120 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#fffdf5" stroke-width="3"/>
  </g>
</svg>
